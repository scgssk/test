<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Participants Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #020617;
      color: #e5e7eb;
    }

    header {
      padding: 1rem 1.5rem;
      background: #0f172a;
      border-bottom: 1px solid #1f2937;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 1.2rem;
      margin: 0;
    }

    .container {
      padding: 1rem 1.5rem;
      display: grid;
      gap: 1rem;
    }

    .grid {
      display: grid;
      gap: 1rem;
    }

    @media (min-width: 900px) {
      .grid {
        grid-template-columns: 1.2fr 2fr;
      }
    }

    .card {
      background: #020617;
      border: 1px solid #1f2937;
      border-radius: 0.75rem;
      padding: 1rem 1.25rem;
    }

    .card h2 {
      margin-top: 0;
      font-size: 1.05rem;
      margin-bottom: 0.75rem;
    }

    label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 0.25rem;
    }

    input, select, button {
      font: inherit;
    }

    input, select {
      width: 100%;
      padding: 0.45rem 0.6rem;
      border-radius: 0.5rem;
      border: 1px solid #334155;
      background: #020617;
      color: #e5e7eb;
      margin-bottom: 0.6rem;
    }

    button {
      padding: 0.45rem 0.9rem;
      border-radius: 0.5rem;
      border: none;
      cursor: pointer;
    }

    .btn-primary {
      background: #2563eb;
      color: white;
    }

    .btn-primary:hover {
      background: #1d4ed8;
    }

    .btn-danger {
      background: #b91c1c;
      color: white;
    }

    .btn-danger:hover {
      background: #991b1b;
    }

    .btn-ghost {
      background: transparent;
      color: #e5e7eb;
      border: 1px solid #374151;
    }

    .btn-small {
      font-size: 0.75rem;
      padding: 0.3rem 0.6rem;
      margin-left: 0.25rem;
    }

    .row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
    }

    @media (max-width: 500px) {
      .row {
        grid-template-columns: 1fr;
      }
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    th, td {
      padding: 0.45rem 0.4rem;
      border-bottom: 1px solid #1f2937;
      text-align: left;
    }

    th {
      background: #020617;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    tbody tr:nth-child(even) {
      background: #020617;
    }

    tbody tr:nth-child(odd) {
      background: #020617;
    }

    .status-pill {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .status-waiting {
      background: #1e293b;
      color: #e5e7eb;
    }

    .status-qualified {
      background: #166534;
      color: #bbf7d0;
    }

    .status-rejected {
      background: #7f1d1d;
      color: #fecaca;
    }

    .badge {
      display: inline-block;
      padding: 0.1rem 0.5rem;
      border-radius: 999px;
      border: 1px solid #1d4ed8;
      font-size: 0.7rem;
      margin-left: 0.35rem;
      color: #93c5fd;
    }

    .muted {
      font-size: 0.8rem;
      color: #9ca3af;
    }

    .message {
      font-size: 0.8rem;
      min-height: 1rem;
    }

    .message.error {
      color: #fecaca;
    }

    .message.success {
      color: #bbf7d0;
    }
  </style>
</head>
<body>

<header>
  <h1>Participants Admin</h1>
  <span class="muted">MongoDB + Express API viewer</span>
</header>

<div class="container">
  <div class="grid">
    <!-- Filters + Add form -->
    <section class="card">
      <h2>Filters</h2>
      <div class="row">
        <div>
          <label for="filterSkill">Skill</label>
          <select id="filterSkill">
            <option value="">All</option>
            <!-- Dynamically populated from data -->
          </select>
        </div>
        <div>
          <label for="filterScore">Min score</label>
          <input type="number" id="filterScore" placeholder="e.g. 80" min="0" max="100" />
        </div>
      </div>
      <button id="applyFiltersBtn" class="btn-ghost">Apply filters</button>
      <button id="clearFiltersBtn" class="btn-ghost btn-small">Clear</button>
    </section>

    <section class="card">
      <h2>Add Participant</h2>
      <div>
        <label for="nameInput">Name</label>
        <input id="nameInput" placeholder="Participant name" />
      </div>
      <div>
        <label for="skillInput">Skill</label>
        <input id="skillInput" placeholder="e.g. web, cloud" />
      </div>
      <div>
        <label for="scoreInput">Score</label>
        <input id="scoreInput" type="number" placeholder="0–100" min="0" max="100" />
      </div>
      <button id="addBtn" class="btn-primary">Add</button>
      <div id="formMessage" class="message"></div>
    </section>
  </div>

  <!-- Table -->
  <section class="card">
    <h2>Participants</h2>
    <p class="muted" id="countText"></p>
    <div style="overflow-x:auto; max-height: 400px;">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Skill</th>
            <th>Score</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="participantsBody"></tbody>
      </table>
    </div>
  </section>
</div>

<script>
  const API_BASE = "http://localhost:3000/api/participants";

  const tbody = document.getElementById("participantsBody");
  const countText = document.getElementById("countText");

  const filterSkillEl = document.getElementById("filterSkill");
  const filterScoreEl = document.getElementById("filterScore");
  const applyFiltersBtn = document.getElementById("applyFiltersBtn");
  const clearFiltersBtn = document.getElementById("clearFiltersBtn");

  const nameInput = document.getElementById("nameInput");
  const skillInput = document.getElementById("skillInput");
  const scoreInput = document.getElementById("scoreInput");
  const addBtn = document.getElementById("addBtn");
  const formMessage = document.getElementById("formMessage");

  let participants = [];

  function buildQuery(params) {
    const search = new URLSearchParams();
    if (params.skill) search.set("skill", params.skill);
    if (params.minScore) search.set("minScore", params.minScore);
    const qs = search.toString();
    return qs ? "?" + qs : "";
  }

  async function fetchParticipants(options = {}) {
    const qs = buildQuery(options);
    const res = await fetch(API_BASE + qs);
    const data = await res.json();
    participants = data;
    renderTable();
    populateSkillFilter();
  }

  function populateSkillFilter() {
    const skills = Array.from(new Set(participants.map(p => p.skill))).sort();
    const current = filterSkillEl.value;
    filterSkillEl.innerHTML = '<option value="">All</option>';
    skills.forEach(skill => {
      const opt = document.createElement("option");
      opt.value = skill;
      opt.textContent = skill;
      filterSkillEl.appendChild(opt);
    });
    if (skills.includes(current)) {
      filterSkillEl.value = current;
    }
  }

  function renderTable() {
    tbody.innerHTML = "";

    if (!participants.length) {
      countText.textContent = "No participants found.";
      return;
    }

    countText.textContent = `${participants.length} participant(s) loaded`;

    participants.forEach(p => {
      const tr = document.createElement("tr");

      const tdName = document.createElement("td");
      tdName.textContent = p.name;

      const tdSkill = document.createElement("td");
      tdSkill.textContent = p.skill;

      const tdScore = document.createElement("td");
      tdScore.textContent = p.score;

      const tdStatus = document.createElement("td");
      const span = document.createElement("span");
      span.textContent = p.status;
      span.className = "status-pill status-" + (p.status || "waiting");
      tdStatus.appendChild(span);

      const tdActions = document.createElement("td");

      const qualifyBtn = document.createElement("button");
      qualifyBtn.textContent = "Qualify";
      qualifyBtn.className = "btn-small btn-ghost";
      qualifyBtn.addEventListener("click", () => updateStatus(p._id, "qualified"));

      const rejectBtn = document.createElement("button");
      rejectBtn.textContent = "Reject";
      rejectBtn.className = "btn-small btn-ghost";
      rejectBtn.addEventListener("click", () => updateStatus(p._id, "rejected"));

      const deleteBtn = document.createElement("button");
      deleteBtn.textContent = "Delete";
      deleteBtn.className = "btn-small btn-danger";
      deleteBtn.addEventListener("click", () => deleteParticipant(p._id));

      tdActions.appendChild(qualifyBtn);
      tdActions.appendChild(rejectBtn);
      tdActions.appendChild(deleteBtn);

      tr.appendChild(tdName);
      tr.appendChild(tdSkill);
      tr.appendChild(tdScore);
      tr.appendChild(tdStatus);
      tr.appendChild(tdActions);

      tbody.appendChild(tr);
    });
  }

  async function addParticipant() {
    const name = nameInput.value.trim();
    const skill = skillInput.value.trim();
    const score = Number(scoreInput.value);

    formMessage.textContent = "";
    formMessage.className = "message";

    if (!name || !skill || Number.isNaN(score)) {
      formMessage.textContent = "Please fill name, skill and score correctly.";
      formMessage.classList.add("error");
      return;
    }

    try {
      const res = await fetch(API_BASE, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, skill, score })
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error || "Failed to add participant");
      }

      const created = await res.json();
      participants.push(created);
      renderTable();
      populateSkillFilter();

      nameInput.value = "";
      skillInput.value = "";
      scoreInput.value = "";

      formMessage.textContent = "Participant added.";
      formMessage.classList.add("success");
    } catch (err) {
      formMessage.textContent = err.message;
      formMessage.classList.add("error");
    }
  }

  async function updateStatus(id, status) {
    try {
      const res = await fetch(API_BASE + "/" + id, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ status })
      });

      if (!res.ok) return;

      await fetchParticipants({
        skill: filterSkillEl.value || "",
        minScore: filterScoreEl.value || ""
      });
    } catch (err) {
      console.error(err);
    }
  }

  async function deleteParticipant(id) {
    if (!confirm("Delete this participant?")) return;

    try {
      const res = await fetch(API_BASE + "/" + id, {
        method: "DELETE"
      });
      if (!res.ok) return;
      await fetchParticipants({
        skill: filterSkillEl.value || "",
        minScore: filterScoreEl.value || ""
      });
    } catch (err) {
      console.error(err);
    }
  }

  applyFiltersBtn.addEventListener("click", () => {
    fetchParticipants({
      skill: filterSkillEl.value || "",
      minScore: filterScoreEl.value || ""
    });
  });

  clearFiltersBtn.addEventListener("click", () => {
    filterSkillEl.value = "";
    filterScoreEl.value = "";
    fetchParticipants();
  });

  addBtn.addEventListener("click", addParticipant);

  fetchParticipants();
</script>

</body>
  </html>
